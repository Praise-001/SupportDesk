services:
  support-desk:
    build: .
    container_name: support-desk
    ports:
      - "3000:3000"
    volumes:
      - support_data:/app/data
    environment:
      - PORT=3000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/auto}
      - DEMO_COMPANIES=${DEMO_COMPANIES:-on}
    restart: unless-stopped

volumes:
  support_data:

